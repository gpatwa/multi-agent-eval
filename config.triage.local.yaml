# Local models only — $0/ticket, no account, data never leaves the machine.
# Judged by Gemini (hosted) because the judge needs to be more capable than
# what it grades; a 7-8B local judge is not reliable enough to grade with.
#
#   ollama serve
#   python main.py --config config.triage.local.yaml --out results-local
#
# The real question here: "is a free, private, on-device model good enough
# for support triage?" These are 4-8B laptop-scale models, not the
# trillion-parameter hosted flagships — expect a gap, especially on the
# strict JSON output contract and the guardrail probes.

use_case: support_triage
tasks: tasks.triage.yaml

candidates:
  - name: llama3
    provider: local
    model: llama3:latest       # Meta, 8B
  - name: llama2
    provider: local
    model: llama2:latest       # Meta, 7B (previous generation)
  - name: qwen3
    provider: local
    model: qwen3:latest        # Alibaba, 8B

judge:
  provider: gemini
  model: gemini-3.1-pro-preview

scorecard:
  # Local inference has no per-token cost, so cost is not a differentiator
  # here — quality and latency are.
  weights:
    quality: 0.7
    latency: 0.3
    cost: 0.0
