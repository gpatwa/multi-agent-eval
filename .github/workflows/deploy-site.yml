name: Deploy site

# Publishes docs/ to Cloudflare Pages at the site URL in release.yaml, attaches the custom domain, sets its DNS record
# in the domain's Cloudflare zone, verifies the live URL, and pings IndexNow. Fully idempotent — see scripts/deploy_site.py.
# The only credentials are two GitHub secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); until they exist this job
# says so loudly instead of looking green.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "release.yaml"
      - "scripts/deploy_site.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Site NOT deployed::Deploy credentials are not set, so this run published nothing (a green check here does not mean the site is live). Run: python scripts/deploy_site.py doctor"
            echo "### Site NOT deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy credentials are not set, so nothing was published. \`python scripts/deploy_site.py doctor\` lists exactly what is missing." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pip install pyyaml
      - name: Deploy and verify
        if: steps.creds.outputs.ready == 'true'
        run: python scripts/deploy_site.py deploy
