name: Deploy site

# Publishes docs/ to https://eval.aveto.com via Cloudflare Pages, and keeps the
# eval.aveto.com CNAME at NIC.RU pointed at it. Fully idempotent — see
# scripts/deploy_site.py. Credentials are GitHub secrets, stored once with
# `python scripts/deploy_site.py bootstrap`; until they exist this job skips.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/deploy_site.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NICRU_USERNAME: ${{ secrets.NICRU_USERNAME }}
      NICRU_PASSWORD: ${{ secrets.NICRU_PASSWORD }}
      NICRU_CLIENT_ID: ${{ secrets.NICRU_CLIENT_ID }}
      NICRU_CLIENT_SECRET: ${{ secrets.NICRU_CLIENT_SECRET }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$NICRU_USERNAME" ] \
             && [ -n "$NICRU_PASSWORD" ] && [ -n "$NICRU_CLIENT_ID" ] && [ -n "$NICRU_CLIENT_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Site NOT deployed::Deploy credentials are not set, so this run published nothing (a green check here does not mean the site is live). Run: python scripts/deploy_site.py doctor"
            echo "### Site NOT deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy credentials are not set, so nothing was published. \`python scripts/deploy_site.py doctor\` lists exactly what is missing." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Deploy and verify
        if: steps.creds.outputs.ready == 'true'
        run: python scripts/deploy_site.py deploy
