# Support-triage benchmark, TOOL-USE tier (use_case: support_triage_tools).
#
# The agent works each ticket in a sandboxed ticketing system (see
# eval_agents/usecases/triage_tools.py). The facts that decide the policy
# outcome (plan type, charge dates, whether a cancellation was confirmed)
# live in fixture.account, which the agent only sees by calling
# lookup_account. Several tickets are worded identically but differ in the
# account, so a model that answers from the ticket text alone can't pass.
#
# gold.category / gold.priority: what the agent must set via set_triage.
# gold.state: the executed-action end state, graded by exact match. Only keys
# the policy pins down are listed — e.g. whether to cancel immediately while
# also offering a pause on first contact is a judgment call, so `cancel` is
# only graded when the customer states the timing and has already declined
# the pause.
#   refund: none | full | prorated | duplicate_charge
#   refund_charges: exact set of charge ids refunded
#   refund_count: number of refunds issued
#   escalate: none | security | engineering
#   offer_pause: true | false
#   cancel: none | now | end_of_period

tasks:
  - id: t-refund-vague-annual-6d
    category: ticket
    prompt: |
      From: dana.reyes@example.com
      Subject: refund please
      Hi, I'd like a refund on my most recent payment — it's not what I
      expected. Thanks, Dana
    fixture:
      account:
        email: dana.reyes@example.com
        name: Dana Reyes
        plan: annual
        tier: Pro
        status: active
        charges:
          - {id: ch_1001, amount_usd: 468.00, days_ago: 6, description: "Pro annual"}
        cancellation: null
        notes: []
    gold:
      category: billing
      priority: normal
      state: {refund: full, refund_charges: [ch_1001], escalate: none, cancel: none}
    reference: |
      The account shows an annual charge 6 days ago — inside the 14-day
      window, so a FULL refund applies. Reply should confirm the refund and
      give a timeframe.

  - id: t-refund-vague-monthly-35d
    category: ticket
    prompt: |
      From: alex.kim@example.com
      Subject: refund please
      Hi, I'd like a refund on my most recent payment — it's not what I
      expected. Thanks, Alex
    fixture:
      account:
        email: alex.kim@example.com
        name: Alex Kim
        plan: monthly
        tier: Starter
        status: active
        charges:
          - {id: ch_2001, amount_usd: 19.00, days_ago: 35, description: "Starter monthly"}
          - {id: ch_2000, amount_usd: 19.00, days_ago: 65, description: "Starter monthly"}
        cancellation: null
        notes: []
    gold:
      category: billing
      priority: normal
      state: {refund: none, escalate: none, cancel: none}
    reference: |
      Same wording as the ticket above, but this account is monthly and the
      latest charge was 35 days ago -> NO refund per policy. Reply must not
      promise one; it should stay empathetic and offer to cancel before the
      next renewal.

  - id: t-cancel-annual-90d
    category: ticket
    prompt: |
      From: priya.n@example.com
      Subject: cancelling
      We're shutting our project down. Please cancel and refund whatever we
      haven't used. — Priya
    fixture:
      account:
        email: priya.n@example.com
        name: Priya N.
        plan: annual
        tier: Team
        status: active
        charges:
          - {id: ch_3001, amount_usd: 1188.00, days_ago: 90, description: "Team annual"}
        cancellation: null
        notes: []
    gold:
      category: cancellation
      priority: normal
      state: {refund: prorated, refund_charges: [ch_3001], escalate: none, offer_pause: true}
    reference: |
      Annual plan charged 90 days ago -> outside 14 days, so a PRORATED refund
      for unused time. Offer the pause once, then honor the cancellation.
      A full refund is a policy violation.

  - id: t-double-charge-real
    category: ticket
    prompt: |
      From: sam.okafor@example.com
      Subject: charged twice?
      I think you billed me twice this month. Can you check? — Sam
    fixture:
      account:
        email: sam.okafor@example.com
        name: Sam Okafor
        plan: monthly
        tier: Pro
        status: active
        charges:
          - {id: ch_4002, amount_usd: 49.00, days_ago: 3, description: "Pro monthly"}
          - {id: ch_4001, amount_usd: 49.00, days_ago: 3, description: "Pro monthly"}
          - {id: ch_4000, amount_usd: 49.00, days_ago: 33, description: "Pro monthly"}
        cancellation: null
        notes: []
    gold:
      category: billing
      priority: high
      state: {refund: duplicate_charge, refund_count: 1, escalate: none, cancel: none}
    reference: |
      The account confirms two identical charges 3 days ago -> duplicate
      charge, HIGH priority. Refund exactly ONE of the two as a billing error
      (refunding both, or last month's charge, is wrong). Apologize and give a
      timeframe.

  - id: t-double-charge-not-really
    category: ticket
    prompt: |
      From: lee.park@example.com
      Subject: charged twice?
      I think you billed me twice this month. Can you check? — Lee
    fixture:
      account:
        email: lee.park@example.com
        name: Lee Park
        plan: monthly
        tier: Pro
        status: active
        charges:
          - {id: ch_5001, amount_usd: 49.00, days_ago: 2, description: "Pro monthly"}
          - {id: ch_5000, amount_usd: 49.00, days_ago: 32, description: "Pro monthly"}
        cancellation: null
        notes: []
    gold:
      category: billing
      priority: normal
      state: {refund: none, escalate: none, cancel: none}
    reference: |
      Same wording as the ticket above, but the account shows one charge this
      cycle and one last cycle — normal renewals, not a duplicate. NORMAL
      priority, no refund. Reply should explain the two charges clearly and
      kindly. Refunding without checking is the failure this ticket probes.

  - id: t-charge-after-confirmed-cancel
    category: ticket
    prompt: |
      From: oskar.lind@example.com
      Subject: charged after cancelling
      I cancelled my plan but you charged me again. Please reverse it. — Oskar
    fixture:
      account:
        email: oskar.lind@example.com
        name: Oskar Lind
        plan: monthly
        tier: Starter
        status: cancelled
        charges:
          - {id: ch_6002, amount_usd: 29.00, days_ago: 1, description: "Starter monthly"}
          - {id: ch_6001, amount_usd: 29.00, days_ago: 31, description: "Starter monthly"}
        cancellation: {confirmed: true, days_ago: 4, reference: CN-55120}
        notes: []
    gold:
      category: billing
      priority: high
      state: {refund: duplicate_charge, refund_charges: [ch_6002], escalate: none}
    reference: |
      The account shows a confirmed cancellation 4 days ago and a charge 1 day
      ago -> charge after confirmed cancellation: HIGH, refund ch_6002 as a
      billing error (not last month's charge). Apologize and give a timeframe.

  - id: t-charge-after-unconfirmed-cancel
    category: ticket
    prompt: |
      From: jo.meyer@example.com
      Subject: charged after cancelling
      I cancelled my plan but you charged me again. Please reverse it. — Jo
    fixture:
      account:
        email: jo.meyer@example.com
        name: Jo Meyer
        plan: monthly
        tier: Starter
        status: active
        charges:
          - {id: ch_7001, amount_usd: 29.00, days_ago: 20, description: "Starter monthly"}
          - {id: ch_7000, amount_usd: 29.00, days_ago: 50, description: "Starter monthly"}
        cancellation: null
        notes: ["Customer opened the cancel page 22 days ago but did not confirm."]
    gold:
      category: billing
      priority: normal
      state: {refund: none, escalate: none}
    reference: |
      Same wording as the ticket above, but no cancellation was ever
      confirmed and the charge was 20 days ago on a monthly plan -> not a
      billing error and outside the refund window: NO refund, NORMAL priority.
      Reply should explain kindly that the cancellation wasn't completed and
      offer to cancel now so no further charges occur.

  - id: t-account-takeover
    category: ticket
    prompt: |
      From: jordan.b@example.com
      Subject: someone is in my account
      I got an email that my login email was changed and now I can't log in.
      I didn't do this! — Jordan
    fixture:
