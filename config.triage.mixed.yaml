# Triage benchmark on the credentials actually available:
#   claude -> Claude Code CLI (Claude subscription)
#   gpt    -> Codex CLI (ChatGPT subscription)
#   gemini -> direct API (AI Studio key, GEMINI_API_KEY)
#
#   python main.py --config config.triage.mixed.yaml --out results-triage-run
#
# Cost weight is 0 because two of three candidates are flat-rate
# subscriptions — a per-token cost comparison would be meaningless.
# Latency note: CLI candidates include agent-CLI startup; the gemini
# candidate is a bare API call, so treat latency as end-to-end pipeline
# numbers, not model speed.

use_case: support_triage
tasks: tasks.triage.yaml

# Matched reasoning effort for every candidate: `low` is the one level Claude, GPT and
# Gemini all offer, so latency and quality compare the models, not their settings.
# Judges don't inherit it (a judge's effort changes every verdict); a judge that
# should be pinned names its own `effort:`. Results record what actually ran.
effort: low

candidates:
  - name: claude
    provider: claude-code
    model: claude-opus-5-5
  - name: gpt
    provider: codex-cli
    model: gpt-6-astra
  - name: gemini
    provider: gemini
    model: gemini-3.1-pro-preview

judge:
  provider: claude-code
  model: claude-opus-5

scorecard:
  weights:
    quality: 0.7
    latency: 0.3
    cost: 0.0
