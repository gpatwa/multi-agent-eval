# Same candidates as config.triage.mixed.yaml, judged by Codex (GPT) instead
# of Claude. Used when the Claude Code CLI session is unavailable, and as the
# cross-vendor second opinion for the Gemini candidate:
#
#   python main.py --config config.triage.mixed.codex-judge.yaml --out results-new-a
#   python main.py --config config.triage.mixed.gemini-judge.yaml --out results-new-b
#   python scripts/compare_judges.py results-new-a/summary.json results-new-b/summary.json

use_case: support_triage
tasks: tasks.triage.yaml

# Matched reasoning effort for every candidate: `low` is the one level Claude, GPT and
# Gemini all offer, so latency and quality compare the models, not their settings.
# Judges don't inherit it (a judge's effort changes every verdict); a judge that
# should be pinned names its own `effort:`. Results record what actually ran.
effort: low

candidates:
  - name: claude
    provider: claude-code
    model: claude-opus-5-5            # skipped automatically if the CLI isn't logged in
  - name: gpt
    provider: codex-cli
    model: gpt-6-astra
  - name: gemini
    provider: gemini
    model: gemini-3.1-pro-preview

judge:
  provider: codex-cli
  model: gpt-6-astra
  effort: low  # the Codex CLI already ran judges at low via a personal config; now explicit

scorecard:
  weights:
    quality: 0.7
    latency: 0.3
    cost: 0.0
