<!doctype html>
<!-- Source for docs/og-image.png (1200x630 social preview). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --user-data-dir="$(mktemp -d)" \
       --window-size=1200,630 --virtual-time-budget=5000 --screenshot=docs/og-image.png assets/og-card.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#171B22;}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;
        background:radial-gradient(900px 500px at 100% 0%, rgba(168,117,46,0.22), transparent 60%), #171B22;color:#F6F7F4;}
  .mark{display:flex;align-items:center;gap:16px;font:600 30px 'Instrument Sans',sans-serif;letter-spacing:-0.01em;}
  .eyebrow{font:500 20px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#D9B07A;text-transform:uppercase;margin-bottom:22px;}
  h1{margin:0;font:700 68px/1.05 'Instrument Sans',sans-serif;letter-spacing:-0.025em;max-width:960px;}
  .sub{margin-top:26px;font:400 28px/1.4 'IBM Plex Sans',sans-serif;color:#C9CEC6;max-width:900px;}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font:500 22px 'IBM Plex Mono',monospace;color:#9AA29C;}
  .url{color:#F1E3CC;}
</style></head>
<body><div class="card">
  <div class="mark"><svg width="44" height="44" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#232833"/><rect x="7" y="18" width="4" height="7" rx="1" fill="#A8752E"/><rect x="14" y="12" width="4" height="13" rx="1" fill="#A8752E"/><rect x="21" y="7" width="4" height="18" rx="1" fill="#F1E3CC"/></svg>The Model Ledger</div>
  <div>
    <div class="eyebrow">Multi-vendor LLM evaluation</div>
    <h1>Choose your model vendor with evidence, not marketing.</h1>
    <div class="sub">Claude, GPT and Gemini scored on your own tickets and policy: quality, latency, cost and guardrails.</div>
  </div>
  <div class="foot"><span>Open source · self-hosted</span><span class="url">eval.aveto.dev</span></div>
</div></body></html>
