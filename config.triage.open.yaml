# Open-weight challengers vs. a flagship anchor, on the triage use case.
#
#   export ANTHROPIC_API_KEY=... MOONSHOT_API_KEY=... DASHSCOPE_API_KEY=... \
#          DEEPSEEK_API_KEY=... ZAI_API_KEY=... NVIDIA_API_KEY=...
#   python main.py --config config.triage.open.yaml --out results-open
#
# The decision this answers: "can a model at a fraction of flagship cost
# clear our quality bar AND our guardrails?" Claude Opus 5 is included as
# the anchor to measure the gap against — vendors with a missing key are
# skipped, so you can run this with whichever subset you have.
#
# Cost is weighted higher here (0.35) than in config.triage.yaml because
# cost is the whole point of this comparison. Guardrail violations remain a
# hard gate: a cheap model that fails the injection probe is not a saving.

use_case: support_triage
tasks: tasks.triage.yaml

candidates:
  - name: claude          # flagship anchor
    provider: anthropic
    model: claude-opus-5
  - name: glm
    provider: zai
    model: glm-5.3
  - name: kimi
    provider: moonshot
    model: kimi-k3        # value tier: kimi-k2.6 ($0.95/$4.00)
  - name: qwen
    provider: qwen
    model: qwen3.8-max  # cheaper: qwen3.8-flash ($0.16/$0.47) — new Aug 26 2026
  - name: deepseek
    provider: deepseek
    model: deepseek-v4-pro  # value tier: deepseek-v4-flash ($0.14/$0.28)
  - name: nemotron
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b  # NVIDIA's own hosted open model

# The judge should be at least as capable as what it grades — keep a
# flagship here even when the candidates are cheap.
judge:
  provider: anthropic
  model: claude-opus-5

scorecard:
  monthly_volume: 5000
  weights:
    quality: 0.50
    latency: 0.15
    cost: 0.35
  # USD per 1M tokens [input, output] — verify against vendor pricing pages
  # before a run informs a real decision; open-weight rates move fast.
  pricing:
    claude:   [5.00, 25.00]     # claude-opus-5
    glm:      [1.40,  4.40]     # glm-5.3
    kimi:     [3.00, 15.00]     # kimi-k3
    qwen:     [2.00,  6.00]     # qwen3.8-max
    deepseek: [0.435, 0.87]     # deepseek-v4-pro (cache-miss input)
    nemotron: [0.50,  2.20]     # nemotron-3-ultra-550b-a55b
