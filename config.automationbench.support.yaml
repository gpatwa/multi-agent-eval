# AutomationBench support domain (public set) as a lane in this harness.
# Needs the optional extra (Python >= 3.13): pip install -r requirements-automationbench.txt
#
#   python main.py --config config.automationbench.support.yaml --out results-ab-support-runN
#   python main.py --config config.automationbench.support.yaml --tasks automationbench:support   # all 100
#
# Scoring: AutomationBench's own deterministic assertions (partial credit on
# the 1-5 scale; the report adds their strict pass rate), plus our judge's
# grade of any external-facing messages (customers, vendors, partners),
# blended in at 25% of `overall`.
# Numbers are directional — the official leaderboard uses a harder private
# set and their own runner (see eval_agents/usecases/automationbench.py).
#
# Cost: tasks are long multi-app workflows (often 50k-150k input tokens
# each), so the default is a fixed 20-task sample (x3 trials: ~$10 on Gemini). Candidates need tool
# support: API providers only; missing keys skip that candidate.

use_case: automationbench
tasks: automationbench:support:20

# Runs per task. AutomationBench is high-variance run to run (the same model
# swung 17/19 -> 4/26 on one task, and stopped after 4 calls then finished the
# workflow on another), so single runs can't separate models. With 3 trials
# the report's CI is over per-task means, and "passed every trial" shows
# consistency. Cost scales linearly: ~3x a single-trial run. Override with --trials.
trials: 3

candidates:
  - name: claude
    provider: anthropic
    model: claude-opus-5-5
  - name: gpt
    provider: openai
    model: gpt-6-astra
  - name: gemini
    provider: gemini
    model: gemini-3.1-pro-preview

# The judge grades only the external-facing messages the agent sends (tone,
# clarity, appropriateness for the recipient, internal-info leaks) — the part AutomationBench's
# deterministic assertions don't cover. Any provider works; the subscription
# CLI keeps it flat-rate. Tasks with no external-facing message never call it.
judge:
  provider: claude-code
  model: claude-opus-5

scorecard:
  monthly_volume: 5000
  weights:
    quality: 0.7
    latency: 0.15
    cost: 0.15
  # USD per 1M tokens [input, output] — same verified rates as config.triage.yaml.
  pricing:
    claude: [4.00, 20.00]    # claude-opus-5-5
    gpt: [10.00, 50.00]       # gpt-6-astra
    gemini: [2.00, 12.00]    # gemini-3.1-pro-preview (<=200k prompts)
  # Caveat: history grows every turn, and long tasks can push single requests past
  # Gemini's 200k-token tier, which bills at a higher rate — cost may undercount.
